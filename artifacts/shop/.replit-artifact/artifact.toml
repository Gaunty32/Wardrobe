kind = "web"
previewPath = "/"
title = "SBS Shop"
version = "1.0.0"
id = "artifacts/shop"
router = "path"

[[services]]
name = "web"
paths = [
  "/",
  "/company-clothing-portal-guide",
  "/how-to-brand-work-trousers",
  "/when-should-staff-wear-hi-vis",
  "/safety-footwear-that-works-as-hard-as-your-team",
  "/uniform-portal-software-review",
  "/multi-site-workwear-rollout-case-study-uk-teams",
  "/embroidered-fleece-jackets",
  "/uniform-fabric-selection-workwear",
  "/industrial-workwear-bundles",
  "/in-house-embroidery-vs-outsourcing-workwear",
  "/workwear-for-construction-teams",
  "/when-should-companies-replace-uniforms"
]
localPort = 24349

[services.development]
run = "pnpm --filter @workspace/shop run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shop", "run", "build" ]
serve = "static"
publicDir = "artifacts/shop/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24349"
BASE_PATH = "/"
